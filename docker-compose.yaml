version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres-db-blog
    volumes:
      - db-data:/var/lib/postgresql/data
      #- ./scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: blog
    ports:
      - "5432:5432"

volumes:
  db-data:
